<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Acceso al POS · The Burgers Brother</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../brand.css?v=20261128-black-gold-login">
  <script type="module" src="./login.js?v=20261127m"></script>
</head>
<body class="staff-login-page">
  <main class="staff-login-card">
    <header class="staff-login-heading">
      <img class="staff-login-logo" src="../logo-burgers-brother.webp" width="88" height="88" alt="The Burgers Brother">
      <span class="staff-login-head-sep" aria-hidden="true"></span>
      <div class="staff-login-brand-copy">
        <p class="staff-login-eyebrow">THE BURGERS BROTHER</p>
        <h1>Acceso al POS</h1>
      </div>
    </header>

    <div id="staff-active-session" class="staff-active-session" hidden>
      <p id="staff-active-session-label"></p>
      <a id="staff-active-session-link" class="staff-active-session-cta" href="../#modulos">Ir al POS</a>
    </div>

    <form id="staff-login-form" method="post" action="../api/session" novalidate>
      <div class="staff-field">
        <label id="staff-role-label" for="staff-role-trigger" class="staff-field-label">Perfil de acceso</label>
        <div class="staff-role-picker">
          <select id="staff-role" name="role" class="sr-only" tabindex="-1" aria-hidden="true">
            <option value="admin">Administración</option>
            <option value="chef">Cocina</option>
          </select>
          <button type="button" id="staff-role-trigger" class="staff-role-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="staff-role-listbox" aria-labelledby="staff-role-label staff-role-current-text">
            <span id="staff-role-icon-badge" class="staff-role-icon-badge" aria-hidden="true"></span>
            <span class="staff-input-sep" aria-hidden="true"></span>
            <span id="staff-role-current-text" class="staff-role-text">
              <strong class="staff-role-title">Administración</strong>
              <span class="staff-role-user">Nicol</span>
            </span>
            <span id="staff-role-caret" class="staff-role-caret" aria-hidden="true"></span>
          </button>
          <div id="staff-role-listbox" class="staff-role-listbox" role="listbox" aria-labelledby="staff-role-label" hidden tabindex="-1"></div>
        </div>
      </div>

      <div class="staff-field">
        <label for="staff-password" class="staff-field-label">Clave de acceso</label>
        <div id="staff-password-wrap" class="staff-password-wrap">
          <span id="staff-password-lock" class="staff-input-icon" aria-hidden="true"></span>
          <span class="staff-input-sep" aria-hidden="true"></span>
          <input id="staff-password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu clave" required>
          <button type="button" id="staff-toggle-password" class="staff-password-toggle" aria-label="Mostrar clave" aria-pressed="false"></button>
        </div>
      </div>

      <div id="staff-login-error" class="staff-login-error" role="alert" aria-live="assertive" hidden></div>

      <button type="submit" id="staff-login-submit" class="staff-login-submit">
        <span id="staff-login-submit-icon" class="staff-login-submit-icon" aria-hidden="true"></span>
        <span id="staff-login-submit-label">Iniciar sesión</span>
      </button>
    </form>

    <a class="staff-login-return" href="../">
      <span id="staff-return-icon" class="staff-return-icon" aria-hidden="true"></span>
      <span class="staff-return-label">Volver a la carta digital</span>
    </a>
  </main>
</body>
</html>
