<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5ecdc">
  <title>Acceso del personal · The Burgers Brother</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../brand.css">
  <script type="module" src="./login.js"></script>
</head>
<body class="staff-login-page">
  <main class="staff-login-card">
    <div class="staff-login-heading">
      <img src="../logo-burgers-brother.webp" width="56" height="56" alt="The Burgers Brother">
      <div>
        <p class="staff-login-eyebrow">The Burgers Brother</p>
        <h1>Acceso del personal</h1>
      </div>
    </div>
    <div id="staff-active-session" class="staff-active-session" hidden>
      <p id="staff-active-session-label"></p>
      <a id="staff-active-session-link" class="staff-active-session-cta" href="../#modulos">Ir a Módulos</a>
    </div>
    <form id="staff-login-form" method="post" action="../api/session">
      <label for="staff-role">Área de trabajo</label>
      <select id="staff-role" name="role">
        <option value="admin">Nicol · Administración</option>
        <option value="chef">Cocina</option>
      </select>
      <label for="staff-password">Clave del personal</label>
      <input id="staff-password" name="password" type="password" autocomplete="current-password" required>
      <p id="staff-login-error" role="alert"></p>
      <button type="submit" id="staff-login-submit">Iniciar sesión</button>
    </form>
    <a class="staff-login-return" href="../">Volver a la carta</a>
  </main>
</body>
</html>
